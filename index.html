<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="main.js" type="module"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.cubing.net/v0/js/cubing/twisty" type="module"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>3x3 BindFold Practice</title>
</head>
<body>
    <h1>3x3 BindFold Practice</h1>
    <h2 class="scramble"></h2>

    <div class="changeScramble">
        <button class="btn btn-primary changeScr">New Scramble</button>
    </div>

    <div class="timer">
        <h1 class="time">0.00</h1>
    </div>
<br>

<div class="container text-center">
    <div class="row align-items-start">
        <div class="col">
        <h3>Scramble Visualisation</h3>
        <twisty-player 
            id="cube" puzzle="3x3x3" 
            control-panel="none"
            background="none" 
            hint-facelets="none"
            style="width: 300px; height: 300px; text-align:center; margin: 0 auto;"
            visualization="2D"
            >
        </twisty-player>
        </div>

        <div class="col">
        <h3>Note Taker</h3>
        <div class="input-memo">
            <textarea id="edge-input" placeholder="Enter edge memo"></textarea>
            <textarea id="corner-input" placeholder="Enter corner memo"></textarea>
        </div>
        <button class="btn btn-success" id="memo-btn">Show Hint</button>
        <div class="memo" style="display: none;">
            <p>Edges: <span id="edge-memo"></span></p>
            <p>Parity: <span id="parity-memo"></span></p>
            <p>Corners: <span id="corner-memo"> </span></p>  
        </div>
        </div>
    </div>
</div>
</body>
</html>
