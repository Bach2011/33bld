<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="main.js" type="module"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.cubing.net/v0/js/cubing/twisty" type="module"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>3x3 BindFold Practice</title>
</head>
<body>
    <h1>3x3 BindFold Practice</h1>
    <h2 class="scramble"></h2>
    <button class="btn btn-primary changeScr">Generate Scramble</button>
    <twisty-player 
    id="cube" puzzle="3x3x3" 
    control-panel="none"
    background="none" 
    hint-facelets="none"
    style="width: 300px; height: 300px;"
    visualization="2D">
</twisty-player>

<div class="memo">
    <p>Edges: <span id="edge-memo"></span></p>
    <p>Parity: <span id="parity-memo"></span></p>
    <p>Corners: <span id="corner-memo"> </span></p>  
</div>
<button class="btn btn-success" id="memo-btn">Hide Memo</button>

<div class="input-memo">
    
</div>
</body>
</html>
